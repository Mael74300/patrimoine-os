name: Vérification mensuelle des liens
# Contrôle automatique et gratuit des sources citées : ouvre une issue si un lien est cassé.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --accept 200,403,429 'src/data/**/*.ts' 'src/pages/**/*.tsx' 'src/App.tsx'
          fail: false
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Liens cassés détectés dans les sources
          content-filepath: ./lychee/out.md
          labels: maintenance
